name: Instagramへ投稿

on:
  # LINEの「投稿する」ボタン → Apps Script → ここが起動する
  repository_dispatch:
    types: [ig-publish]
  workflow_dispatch:
    inputs:
      date:
        description: "投稿日 (YYYY-MM-DD)"
        required: false
      index:
        description: "何本目か (0 または 1)"
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 画像がコミットされた最新の main を取る

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
          POST_DATE: ${{ github.event.client_payload.date || inputs.date }}
          POST_INDEX: ${{ github.event.client_payload.index || inputs.index }}
        run: python src/run_publish.py

      - name: 投稿済みフラグをコミット
        run: |
          git config user.name  "chikatabi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "投稿済み記録"
            git pull --rebase
            git push
          fi
